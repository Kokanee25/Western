# Scanned CC0 woods for the material library (#701; tools/textures/scans/fetch_scans.py). Poly Haven
# and ambientCG can't be reached from the workspace, so they're fetched here and committed back to
# the branch that asked ([skip ci]; a push made with the run's token starts no workflow):
#   - the catalogue (thumbnail sheets to choose from) while tools/textures/scans/catalogue/ is absent,
#   - every pick in tools/textures/scans/picks.json not yet in assets/textures/scans/.
# Runs on a push to an art material-library branch that changes tools/textures/scans/, or by hand.
name: Scans fetch

on:
  push:
    branches: ["claude/art-material-library*", "claude/salt-creek-material-panels*"]
    paths: ["tools/textures/scans/**", ".github/workflows/scans.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scans-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - name: Catalogue
        run: |
          if [ ! -d tools/textures/scans/catalogue ]; then
            python3 tools/textures/scans/fetch_scans.py catalogue --out=tools/textures/scans/catalogue 2>&1 | tee build-scans.log
          fi
      - name: Picks
        run: |
          if [ -f tools/textures/scans/picks.json ]; then
            python3 tools/textures/scans/fetch_scans.py fetch --picks=tools/textures/scans/picks.json --out=assets/textures/scans 2>&1 | tee -a build-scans.log
          fi
      - name: Commit back
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          mkdir -p tools/textures/scans/logs && cp build-scans.log "tools/textures/scans/logs/run_${{ github.run_number }}.log" 2>/dev/null || true
          git add -A tools/textures/scans
          if [ -d assets/textures/scans ]; then git add -A assets/textures/scans; fi
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -qm "Scans fetched by run ${{ github.run_number }} [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
