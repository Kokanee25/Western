name: Test and build

# What builds (Sean, 2026-10-29, #504: ~800 branch-push builds a week were most of ~21,000 Actions
# minutes):
# - every push to main: tests, then Windows, Linux and Web exported, the desktop builds
#   released and the web build published to Pages, so each merge gets its build number;
# - a pull request, when it opens and on every push to it after: the tests its changes need (the
#   select job, #1234) and the native plugin;
# - a branch push whose last commit's message says [build]: the same, for a session that wants CI
#   before its PR;
# - by hand (workflow_dispatch).
# No macOS: Sean tests only the Windows build (2026-11-03), and a macOS runner bills 10x. The
# native-build action and the export preset still know macOS, to bring it back.
# Any other branch push starts a run whose jobs are all skipped (no runner, no minutes): sessions
# run the tests locally before pushing.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

# A newer push to a branch cancels its older run, except on main: every merge's build finishes,
# so each merge gets its build number and green check. A [build] push and its open PR's run share
# a group (the branch's name), so only one of the two builds. A push that builds nothing gets a
# group of its own, so it never cancels a PR's build.
concurrency:
  group: >-
    build-${{ (github.event_name == 'push' && github.ref != 'refs/heads/main'
    && !contains(github.event.head_commit.message, '[build]'))
    && format('skip-{0}', github.run_id)
    || format('{0}-{1}', github.head_ref || github.ref_name,
    github.ref == 'refs/heads/main' && github.sha || 'branch') }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which tests this run needs (#1234; Sean, 2026-11-24: sessions waited 50-80 min a PR run, and again
  # each time main moved under them). Main and by hand: everything. A pull
  # request ("[full]" in its last commit's message: everything): the core set plus the tests mapped from the files it changes against main
  # (config/test_map.json, tools/test_select.py), as many shards as that needs; after merging main in,
  # if the PR's last run was green, only what that push changed in the PR's own files, and the PR's
  # tests main's files also touch. Main's full run after every merge is the net for what the map misses.
  select:
    if: >-
      github.event_name != 'push' || github.ref == 'refs/heads/main'
      || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      files: ${{ steps.pick.outputs.files }}
      shards: ${{ steps.pick.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            config
            src
            tests
            tools
      - name: The PR's last run green?
        id: last
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?head_sha=$BEFORE&event=pull_request" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | length' || echo 0)
          echo "green runs for ${BEFORE:0:10}: $n"
          [ "$n" -gt 0 ] && echo "since=$BEFORE" >> "$GITHUB_OUTPUT" || true
      - name: Pick the tests
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
            || contains(github.event.head_commit.message, '[full]') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SINCE: ${{ steps.last.outputs.since }}
        run: |
          python3 tools/test_select.py --check > check.log || { cat check.log; exit 1; }
          git log -1 --format=%B "$HEAD" | grep -qF '[full]' && FULL=true
          if [ "$FULL" = true ]; then
            python3 tools/test_select.py --all --github
          else
            [ -n "$BASE" ] || { git fetch -q origin main; BASE=$(git rev-parse origin/main); }
            python3 tools/test_select.py --base="$BASE" --head="$HEAD" ${SINCE:+--since=$SINCE} --github
          fi

  # The tests, split over parallel jobs (#1015; Sean, 2026-11-16: "I don't want it to become a 4 hour
  # wait"): each runs `--shard=K/N`, its share of the chosen files (all of them on main) by
  # config/test_times.json's seconds per file (refresh it with tools/test_times.py when one shard runs
  # long). The matrix is the most shards a run can use (test_map.json's max_shards and all_shards);
  # a job past what the selection needs does nothing. Each job builds the plugin itself (cached; its
  # Rust tests run once, in the native job) and starts from main's last import (.godot, cached), so
  # setup isn't paid in full every time.
  test:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    name: test (${{ matrix.shard }}/8)
    env:
      TEST_SHARDS: ${{ needs.select.outputs.shards }}
      TEST_FILES: ${{ needs.select.outputs.files }}
      ACTIVE: ${{ matrix.shard <= fromJSON(needs.select.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Not needed
        if: env.ACTIVE != 'true'
        run: echo "This run needs ${TEST_SHARDS} shard(s); this is ${{ matrix.shard }}."

      - uses: actions/checkout@v4
        if: env.ACTIVE == 'true'

      - name: Cache Godot
        if: env.ACTIVE == 'true'
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: env.ACTIVE == 'true' && steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          rm ./*.zip

      - name: Build the native plugin (Linux)
        if: env.ACTIVE == 'true'
        uses: ./.github/actions/native-build
        with:
          target: x86_64-unknown-linux-gnu
          tests: "false"

      # The import (~10 min from nothing) starts from the newest one main saved: Godot reimports
      # only what changed since (it checks each source's hash), and writes .import files for new
      # assets as before, so the check below still sees them.
      # Keyed by the .import files (a new or changed asset's import makes a new one; a source edited
      # in place is just reimported from the last), so main saves one only when those change.
      - name: Restore the last import
        if: env.ACTIVE == 'true'
        id: import-cache
        uses: actions/cache/restore@v4
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.import') }}
          restore-keys: godot-import-${{ env.GODOT_VERSION }}-

      - name: Import project
        if: env.ACTIVE == 'true'
        run: ~/godot/godot --headless --import || true

      - name: Import files committed
        if: env.ACTIVE == 'true'
        # Every asset's .import file must be committed as Godot writes it (a new character, texture
        # or prop included), or every session's import shows it as a change it didn't make.
        # Fix: run `godot --headless --import` and commit the .import files it lists here.
        run: |
          changed=$(git status --porcelain -- '*.import')
          if [ -n "$changed" ]; then
            echo "::error::Godot's import wrote .import files that aren't committed as it writes them:"
            echo "$changed"
            echo "Run godot --headless --import and commit these files."
            exit 1
          fi

      # Main's import is kept for the next runs (PRs read main's caches; their own aren't saved,
      # so the cache holds a few, not one per push). One shard saves it, when its key is new.
      - name: Keep the import (main)
        if: >-
          env.ACTIVE == 'true' && github.ref == 'refs/heads/main' && matrix.shard == 1
          && steps.import-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.import') }}

      - name: Run tests
        if: env.ACTIVE == 'true'
        run: |
          ~/godot/godot --headless --fixed-fps 60 -s res://tests/run_tests.gd -- \
              --shard=${{ matrix.shard }}/${TEST_SHARDS} ${TEST_FILES:+--files=$TEST_FILES}

      - name: The feel numbers
        # What tests/test_feel.gd and friends measured, against the ranges in config/feel_ranges.json
        # (this shard's tests only).
        if: always() && env.ACTIVE == 'true'
        run: |
          f="$HOME/.local/share/godot/app_userdata/Salt Creek/feel_measured.json"
          if [ -f "$f" ]; then
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('| Feel | Measured | Agreed |\n|---|---|---|'); [print(f'| {k} | {v[\"value\"]} | {v[\"min\"]} to {v[\"max\"]} |') for k,v in sorted(d.items())]" "$f" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The native plugin (addons/saltcreek_native, Rust) for the desktop platforms. Each runner
  # builds its own; the export job collects them. The web export runs without the plugin.
  native:
    # Builds unless it's a plain branch push (see the top).
    if: >-
      github.event_name != 'push' || github.ref == 'refs/heads/main'
      || contains(github.event.head_commit.message, '[build]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            file: libsaltcreek_native.so
            symbols: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            file: saltcreek_native.dll
            symbols: saltcreek_native.pdb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-build
        with:
          target: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            addons/saltcreek_native/bin/${{ matrix.file }}
            ${{ matrix.symbols && format('addons/saltcreek_native/bin/{0}', matrix.symbols) || '' }}
          if-no-files-found: error

  export:
    needs: [test, native]
    # main; or a branch push whose message says [smoke] (the exports and smoke tests run, nothing
    # is released or published: release and pages are main's alone).
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/main'
      || contains(github.event.head_commit.message, '[smoke]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Read access to the private Character Studio, for Harlan's hands (#914); empty skips them.
      STUDIO_TOKEN: ${{ secrets.STUDIO_TOKEN }}
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      name: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-export-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSLO "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -fsSLO "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            'templates/linux_*x86_64' 'templates/windows_*x86_64*' \
            'templates/web_nothreads_*' 'templates/version.txt' -d "$dest"
          rm ./*.zip ./*.tpz

      - name: Collect the native plugin for every platform
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: addons/saltcreek_native/bin
          merge-multiple: true

      - name: Import project
        run: ~/godot/godot --headless --import || true

      - name: Stamp the build number
        run: |
          printf '{"number": "%s", "commit": "%s"}\n' "${{ github.run_number }}" "$(git rev-parse --short HEAD)" > build_info.json
          cat build_info.json

      # The web build (public, on Pages) first: Harlan's first-person hands never go in it.
      - name: Export the web build
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --export-release "Web" build/web/index.html

      # Harlan's first-person hands (#914, Sean's 3A on #920): MetaHuman Sean's hands, cut and
      # dressed by tools/blender/fp_arms.py from the private Character Studio's frozen model, into
      # the git-ignored assets/people/private/ for the Windows and Linux exports only; never
      # committed (#692). Needs the STUDIO_TOKEN secret (read access to the Studio); without it
      # (or on a fork's PR) the builds keep the painted arms, as before.
      - name: Check out the Studio's MetaHuman (for the hands)
        if: env.STUDIO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: Kokanee25/saltcreek-characters
          token: ${{ env.STUDIO_TOKEN }}
          path: studio
          # (studio/ and config/: the Studio's own lay step for the MetaHuman townsfolk, #933)
          sparse-checkout: |
            frozen/sean_metahuman_s3
            studio
            config
      - name: Python for Blender (the hands)
        if: env.STUDIO_TOKEN != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/build.yml
      - name: Build Harlan's first-person hands
        if: env.STUDIO_TOKEN != ''
        run: |
          pip install -q "bpy==5.0.1" numpy pillow pyyaml
          mkdir -p assets/people/private
          # The valley's MetaHuman townsfolk (#933, config/private_cast.json): his levels laid in
          # by the Studio's own step; without them the cast keeps its Studio men.
          STUDIO=studio tools/characters/fetch_private.sh sean_metahuman_s3 --no-import
          python tools/blender/fp_arms.py --src=studio/frozen/sean_metahuman_s3/sean_metahuman_s3.glb \
              --out=assets/people/private > fp_hands.log 2>&1 || { tail -30 fp_hands.log; exit 1; }
          tail -1 fp_hands.log
          rm -rf studio
          ~/godot/godot --headless --import || true
          test -s assets/people/private/harlan_fp.glb
          test -s assets/people/private/sean_metahuman_s3_lod1.json

      - name: Export
        run: |
          mkdir -p build/windows build/linux
          ~/godot/godot --headless --export-release "Windows" build/windows/SaltCreek.exe
          ~/godot/godot --headless --export-release "Linux" build/linux/SaltCreek.x86_64
          test -s build/windows/SaltCreek.exe
          test -s build/linux/SaltCreek.x86_64
          # The native plugin goes beside the game (Windows, Linux): an
          # export without it runs with no voxel damage, so make sure it's there.
          test -s build/windows/saltcreek_native.dll
          test -s build/linux/libsaltcreek_native.so
          # The plugin's symbols beside its DLL: crash dumps read with them (tools/crash_report.py, #624).
          cp addons/saltcreek_native/bin/saltcreek_native.pdb build/windows/
          test -s build/windows/saltcreek_native.pdb
          ls -la build/windows build/linux
          test -s build/web/index.wasm
          ls -la addons/saltcreek_native/bin

      - name: Give the web build's game data a new name each build
        # Browsers cache index.pck; a new name per build makes them fetch the new game at once.
        run: |
          pck="index-${{ github.run_number }}.pck"
          mv build/web/index.pck "build/web/$pck"
          sed -i "s/\"executable\":\"index\"/\"executable\":\"index\",\"mainPack\":\"$pck\"/; s/\"index\.pck\"/\"$pck\"/" build/web/index.html
          grep -o "\"mainPack\":\"[^\"]*\"" build/web/index.html

      - name: Package
        id: package
        run: |
          short=$(git rev-parse --short HEAD)
          echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=Salt Creek build ${{ github.run_number }} (${short})" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          # Everything the export wrote, the native plugin's library beside the game included.
          (cd build/windows && zip -q -9 -r ../../dist/SaltCreek-windows.zip .)
          (cd build/linux && chmod +x SaltCreek.x86_64 && tar -czf ../../dist/SaltCreek-linux.tar.gz .)
          ls -la dist

      - name: Keep the builds for the smoke test and the release
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Bring the tour videos along
        # Kept on the "tour" release by tour.yml, which renders this build's after this deploy.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/web/tour
          gh release download tour --repo "${{ github.repository }}" -p 'build-*.mp4' -D build/web/tour --clobber || true
          python3 tools/tour_page.py build/web/tour

      - name: Upload web build for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # Each export launched on its own platform for 30 s (src/debug/smoke_test.gd; any error fails it): a
  # plain start, the valley (G8, #1098), then the old town (-- --world=town: the gang, a stick, a fire, a shot). Linux twice: headless, and drawn under software
  # Vulkan so the shaders compile. Only builds that pass are released.
  smoke:
    needs: export
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            how: headless
          - os: ubuntu-latest
            how: drawn
          - os: windows-latest
            how: headless
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    name: smoke (${{ matrix.os }}, ${{ matrix.how }})
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Software Vulkan and a screen
        if: matrix.how == 'drawn'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mesa-vulkan-drivers xvfb

      - name: Run it for 30 s
        shell: bash
        run: |
          case "${{ runner.os }}-${{ matrix.how }}" in
            Linux-headless) tar -xzf dist/SaltCreek-linux.tar.gz; game=(./SaltCreek.x86_64 --headless) ;;
            Linux-drawn) tar -xzf dist/SaltCreek-linux.tar.gz; game=(xvfb-run -a -s "-screen 0 640x360x24" ./SaltCreek.x86_64 --rendering-driver vulkan --resolution 640x360) ;;
            Windows-headless) unzip -q dist/SaltCreek-windows.zip; game=(./SaltCreek.exe --headless) ;;
          esac
          limit=(); command -v timeout >/dev/null && limit=(timeout 900)  # macOS has none: the job's limit
          # The valley as players get it (no --world: a plain start is the valley since G8, #1098;
          # #1003: it once crashed on start in the export, unseen), then the old town, asked for.
          failed=0
          for world in valley town; do
            out="$(pwd -W 2>/dev/null || pwd)/smoke_$world.out"  # a Windows path on Windows
            extra=(); [ "$world" = town ] && extra=(--world=town)
            set +e
            "${limit[@]}" "${game[@]}" -- "${extra[@]}" --smoke-test --smoke-out="$out" > "smoke_$world.log" 2>&1
            code=$?
            set -e
            echo "=== $world"
            cat "smoke_$world.log"
            echo "--- verdict ($world):"
            cat "$out" || echo "(no verdict written)"
            if [ $code -ne 0 ] || ! grep -q "^\[smoke\] ok" "$out"; then
              echo "::error::the ${{ matrix.os }} ${{ matrix.how }} build failed its smoke test in the $world (exit $code)"
              failed=1
            fi
          done
          exit $failed

      - name: What the crash guard wrote (on a failure)
        # #650's CrashGuard notes a crash (crash.txt) or a freeze (freeze_*.txt) in user://blackbox,
        # and Godot logs to user://logs: printed here, since a failed runner keeps nothing.
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: |
          d="$HOME/.local/share/godot/app_userdata/Salt Creek"
          find "$d" -maxdepth 3 -type f -newer dist 2>/dev/null | head -50
          for f in "$d"/blackbox/*.txt "$d"/blackbox/*.json; do [ -f "$f" ] && { echo "=== $f"; head -c 20000 "$f"; echo; }; done
          for f in "$d"/logs/*.log; do [ -f "$f" ] && { echo "=== $f (tail)"; tail -n 80 "$f"; }; done
          ls -la "$HOME/Desktop/Salt Creek crash reports" 2>/dev/null || true

      - name: The same run under gdb (on a failure, the drawn build)
        # Where the crash is: every thread's backtrace at the signal. The watchdog's own SIGSEGV
        # (a freeze it ends) shows as tgkill from 'saltcreek-crash-watchdog'.
        if: failure() && matrix.how == 'drawn'
        shell: bash
        run: |
          sudo apt-get install -y -q gdb > /dev/null
          rm -f smoke.out
          timeout 900 xvfb-run -a -s "-screen 0 640x360x24" gdb -q -batch \
            -ex "handle SIGSEGV stop print" -ex "handle SIGABRT stop print" -ex "handle SIGUSR1 nostop noprint" \
            -ex run -ex "info threads" -ex "thread apply all bt 25" \
            --args ./SaltCreek.x86_64 --rendering-driver vulkan --resolution 640x360 -- --smoke-test --smoke-out="$(pwd)/smoke.out" \
            > gdb.log 2>&1 || true
          grep -n -E "^Thread|signal SIG|^#[0-9]+ " gdb.log | head -300
          echo "--- verdict:"; cat smoke.out 2>/dev/null || echo "(no verdict written)"

  release:
    needs: [export, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.export.outputs.tag }}
          name: ${{ needs.export.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: docs/BUILD_NOTES.md
          make_latest: true
          files: dist/*

  pages:
    needs: [export, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
