name: Test and build

# Every push runs the headless tests. Pushes to main also export Windows, macOS, Linux and Web
# builds, attach the desktop builds to a GitHub Release, and publish the web build to GitHub Pages.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          rm ./*.zip

      - name: Build the native plugin (Linux)
        uses: ./.github/actions/native-build
        with:
          target: x86_64-unknown-linux-gnu

      - name: Import project
        run: ~/godot/godot --headless --import || true

      - name: Run tests
        run: ~/godot/godot --headless --fixed-fps 60 -s res://tests/run_tests.gd

      - name: The feel numbers
        # What tests/test_feel.gd and friends measured, against the ranges in config/feel_ranges.json.
        if: always()
        run: |
          f="$HOME/.local/share/godot/app_userdata/Salt Creek/feel_measured.json"
          if [ -f "$f" ]; then
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('| Feel | Measured | Agreed |\n|---|---|---|'); [print(f'| {k} | {v[\"value\"]} | {v[\"min\"]} to {v[\"max\"]} |') for k,v in sorted(d.items())]" "$f" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The native plugin (addons/saltcreek_native, Rust) for the three desktop platforms. Each runner
  # builds its own; the export job collects them. The web export runs without the plugin.
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            file: libsaltcreek_native.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            file: saltcreek_native.dll
          - os: macos-latest
            target: universal-apple-darwin
            file: libsaltcreek_native.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-build
        with:
          target: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: addons/saltcreek_native/bin/${{ matrix.file }}
          if-no-files-found: error

  export:
    needs: [test, native]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-export-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSLO "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -fsSLO "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            'templates/linux_*x86_64' 'templates/windows_*x86_64*' 'templates/macos.zip' \
            'templates/web_nothreads_*' 'templates/version.txt' -d "$dest"
          rm ./*.zip ./*.tpz

      - name: Collect the native plugin for every platform
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: addons/saltcreek_native/bin
          merge-multiple: true

      - name: Import project
        run: ~/godot/godot --headless --import || true

      - name: Stamp the build number
        run: |
          printf '{"number": "%s", "commit": "%s"}\n' "${{ github.run_number }}" "$(git rev-parse --short HEAD)" > build_info.json
          cat build_info.json

      - name: Export
        run: |
          mkdir -p build/windows build/macos build/linux build/web
          ~/godot/godot --headless --export-release "Windows" build/windows/SaltCreek.exe
          ~/godot/godot --headless --export-release "macOS" build/macos/SaltCreek.zip
          ~/godot/godot --headless --export-release "Linux" build/linux/SaltCreek.x86_64
          ~/godot/godot --headless --export-release "Web" build/web/index.html
          test -s build/windows/SaltCreek.exe
          test -s build/macos/SaltCreek.zip
          test -s build/linux/SaltCreek.x86_64
          test -s build/web/index.wasm
          ls -la addons/saltcreek_native/bin

      - name: Give the web build's game data a new name each build
        # Browsers cache index.pck; a new name per build makes them fetch the new game at once.
        run: |
          pck="index-${{ github.run_number }}.pck"
          mv build/web/index.pck "build/web/$pck"
          sed -i "s/\"executable\":\"index\"/\"executable\":\"index\",\"mainPack\":\"$pck\"/; s/\"index\.pck\"/\"$pck\"/" build/web/index.html
          grep -o "\"mainPack\":\"[^\"]*\"" build/web/index.html

      - name: Package
        id: package
        run: |
          short=$(git rev-parse --short HEAD)
          echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=Salt Creek build ${{ github.run_number }} (${short})" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          (cd build/windows && zip -q -9 ../../dist/SaltCreek-windows.zip SaltCreek.exe)
          cp build/macos/SaltCreek.zip dist/SaltCreek-macos.zip
          (cd build/linux && chmod +x SaltCreek.x86_64 && tar -czf ../../dist/SaltCreek-linux.tar.gz SaltCreek.x86_64)
          ls -la dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: ${{ steps.package.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: docs/BUILD_NOTES.md
          make_latest: true
          files: dist/*

      - name: Bring the tour videos along
        # Kept on the "tour" release by tour.yml, which renders this build's after this deploy.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/web/tour
          gh release download tour --repo "${{ github.repository }}" -p 'build-*.mp4' -D build/web/tour --clobber || true
          python3 tools/tour_page.py build/web/tour

      - name: Upload web build for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  pages:
    needs: export
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
