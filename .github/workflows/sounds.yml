# Recorded sounds (issue #596): Freesound can't be reached from the workspace, so its API is called
# here (tools/sounds/fetch.py; CC0 only; the Sonniss bundles not at all). Runs on a push to a
# gameplay sound branch that changes tools/sounds/, or by hand. The pool goes to the branch
# claude/gameplay-dynamite-sound-pool (one orphan commit, [skip ci]; the workspace can't reach the
# artifacts' storage) ENCRYPTED to tools/sounds/pool_key.pub (tools/sounds/pool_key.sh): Freesound's
# API terms allow intermediate copies only and no publishing of its content outside the game
# (1b, 4a). With no public key only the run's log is pushed.
name: Sounds fetch

on:
  push:
    branches: ["claude/gameplay-dynamite-sound*"]
    paths: ["tools/sounds/**", ".github/workflows/sounds.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: if [ -f tools/sounds/needs_ffmpeg ]; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; fi
      - name: Fetch
        env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: python3 tools/sounds/fetch.py --out=build/sounds 2>&1 | tee build-sounds.log
      - name: Seal the pool
        if: always()
        run: |
          mkdir -p build/push
          cp build-sounds.log build/push/ || true
          if [ -f tools/sounds/pool_key.pub ] && [ -d build/sounds ]; then
            tools/sounds/pool_key.sh seal build/sounds build/push
          else
            echo "no tools/sounds/pool_key.pub: the pool is not pushed" | tee -a build/push/build-sounds.log
          fi
      - name: Commit to the pool branch
        if: always()
        run: |
          cd build/push
          git init -q -b pool
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Sounds fetched by run ${{ github.run_number }} [skip ci]"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pool:claude/gameplay-dynamite-sound-pool
