# Recorded sounds (issue #596): Freesound and the Sonniss bundles can't be reached from the
# workspace, so their pages and files are fetched here. Runs on a push to a gameplay sound branch
# that changes tools/sounds/, or by hand. What it fetched is the run's artifact "sounds"; nothing
# is committed by it.
name: Sounds fetch

on:
  push:
    branches: ["claude/gameplay-dynamite-sound*"]
    paths: ["tools/sounds/**", ".github/workflows/sounds.yml"]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Fetch
        env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: python3 tools/sounds/fetch.py --out=build/sounds 2>&1 | tee build-sounds.log
      - if: always()
        run: mkdir -p build/sounds && cp build-sounds.log build/sounds/ || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sounds
          path: build/sounds
          retention-days: 14
