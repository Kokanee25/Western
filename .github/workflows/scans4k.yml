# 4K copies of the material library's scans for the lab's sharp close-ups (#721; Sean, 2026-11-09:
# "a side branch"). Too heavy for the repo's history (~150-200 MB), so they go as one orphan commit,
# force-pushed, to the pool branch claude/salt-creek-material-panels-tjivo2-scans4k (as the sounds
# pool does). The lab reads them from the git-ignored assets/textures/scans4k/. Only approved woods
# are ever promoted into the game, at the size the game needs. Runs when picks4k.json changes.
name: Scans 4K fetch

on:
  push:
    branches: ["claude/art-material-library*", "claude/salt-creek-material-panels*"]
    paths: ["tools/textures/scans/picks4k.json", ".github/workflows/scans4k.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - name: Fetch at 4K
        run: python3 tools/textures/scans/fetch_scans.py fetch --picks=tools/textures/scans/picks4k.json --out=build/scans4k --hi=1 2>&1 | tee build-scans4k.log
      - name: Push to the pool branch
        if: always()
        run: |
          mkdir -p build/scans4k && cp build-scans4k.log build/scans4k/fetch.log
          cd build/scans4k
          git init -q -b pool
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "4K scans fetched by run ${{ github.run_number }} [skip ci]"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pool:claude/salt-creek-material-panels-tjivo2-scans4k
