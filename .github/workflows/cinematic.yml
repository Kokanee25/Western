# The saloon cinematic (docs/briefs/cinematic.md): the set and cast built in Blender
# (tools/cinematic/saloon.py) and rendered by Cycles on the runner's CPU. A push to a
# claude/cinematic-* branch renders the look-test stills; run by hand for other modes.
name: Cinematic

on:
  push:
    branches: ["claude/cinematic-**"]
    paths: ["tools/cinematic/**", ".github/workflows/cinematic.yml"]
  workflow_dispatch:
    inputs:
      only:
        description: "Stills to render (comma list; empty = all)"
        required: false
        default: ""
      fast:
        description: "Fast preview quality"
        type: boolean
        default: false

concurrency:
  group: cinematic-${{ github.ref }}
  cancel-in-progress: true

env:
  BPY_VERSION: "5.0.1"

jobs:
  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/cinematic.yml

      - name: Install Blender (bpy)
        run: pip install "bpy==${BPY_VERSION}"

      - name: Build the set and render the stills
        run: |
          mkdir -p build/cinematic
          start=$(date +%s)
          python tools/cinematic/saloon.py --stills=build/cinematic/stills \
            --blend=build/cinematic/saloon.blend \
            ${{ inputs.only && format('--only={0}', inputs.only) || '' }} \
            ${{ inputs.fast && '--fast' || '' }} > build/cinematic/blender.log 2>&1 || { tail -60 build/cinematic/blender.log; exit 1; }
          grep -E "rendered|Error|Traceback" build/cinematic/blender.log | tail -20
          echo "took $(( $(date +%s) - start )) s"
          ls -la build/cinematic/stills

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-stills
          path: |
            build/cinematic/stills
            build/cinematic/blender.log
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: cinematic-blend
          path: build/cinematic/saloon.blend
          retention-days: 7
