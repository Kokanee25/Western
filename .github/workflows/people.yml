name: People (Blender)

# Also the texture factory: with `textures` it only has the image model paint the world's materials
# (tools/textures/paint_textures.py), cuts them to tiles (tools/textures/reduce.py) and commits them;
# with `backdrop` it paints the red-rock country round the town (tools/textures/paint_backdrop.py)
# and cuts it into the backdrop's strips (reduce_backdrop.py).

# Builds the game's people from MakeHuman (CC0) with Blender, run by hand from the Actions tab:
# writes the body envelope from the anatomy (Godot), fetches the pinned MakeHuman assets, runs
# tools/blender/make_people.py (Blender as a Python module, bpy), and commits whatever changed in
# assets/people/ back to the branch it ran on. Everything is a script: nothing is hand-made.
# With `paint_views` it only has the image model paint his grey views from the concept painting
# (tools/paint/paint_views.py) and commits those.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Just this person (an id in assets/people/people.json); empty = everyone"
        required: false
        default: ""
      repaint:
        description: "Paint faces (or views) again even where they're painted already"
        type: boolean
        required: false
        default: false
      paint_views:
        description: "Only paint his views from the painting: all, or a list (shot,front,...); empty = make people"
        required: false
        default: ""
      paint_model:
        description: "OpenRouter image model for paint_views (empty = the PAINT_MODEL variable, else FLUX.2 [max])"
        required: false
        default: ""
      paint_sheet:
        description: "With paint_views, also paint all six views in one turnaround picture"
        type: boolean
        required: false
        default: false
      paint_head_sheet:
        description: "With paint_views, also paint six close views of his head in one picture"
        type: boolean
        required: false
        default: false
      textures:
        description: "Instead: paint the world's materials (tools/textures/materials.json): all, saloon, street, or ids (floor,road,...)"
        required: false
        default: ""
      characters:
        description: "Instead: image-to-3D men (tools/characters/): all, or ids; paints the full-length view, then Tripo (needs TRIPO_API_KEY)"
        required: false
        default: ""
      backdrop:
        description: "Instead: paint the backdrop round the town (tools/textures/backdrop.json): all, a layer (far, mid, near) or panels (far_0,near_2)"
        required: false
        default: ""
      style:
        description: "Instead: photo = have the image model photograph the concept scene (docs/style_test/); train = train a style LoRA on fal from docs/concept/ crops + docs/concept/style/ (needs FAL_KEY)"
        required: false
        default: ""

env:
  GODOT_VERSION: "4.7.2"
  BPY_VERSION: "5.0.1"

jobs:
  style-test:
    if: ${{ inputs.style == 'photo' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Photograph the concept scene
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FACE_MODEL: ${{ vars.FACE_MODEL }}
        run: python3 tools/style/photo_reference.py
      - name: Commit the photos
        run: |
          git add docs/style_test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Style test: photo references (run ${{ github.run_number }})"
          git push

  style-train:
    if: ${{ inputs.style == 'train' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Train the style on fal
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          FAL_TRAINER: ${{ vars.FAL_TRAINER }}
        run: |
          pip install pillow
          python3 tools/style/train_style.py
      - name: Keep the fal log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-train
          path: |
            build/style_train/fal_log.json
            build/style_train/sheet.png
          if-no-files-found: ignore
      - name: Commit the LoRA's record
        run: |
          git add tools/style/style_lora.json
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Style: LoRA trained on fal (run ${{ github.run_number }})"
          git push

  textures:
    if: ${{ inputs.textures != '' && inputs.characters == '' && inputs.backdrop == '' && inputs.style == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Paint and reduce the materials
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TEXTURE_MODEL: ${{ inputs.paint_model || vars.TEXTURE_MODEL }}
          PAINT_MODEL: ${{ vars.PAINT_MODEL }}
          WHICH: ${{ inputs.textures }}
          REPAINT: ${{ inputs.repaint }}
        run: |
          pip install pillow numpy scipy
          args=""
          case "$WHICH" in
            all) ;;
            saloon|street) args="--for=$WHICH" ;;
            *) args="--only=$WHICH" ;;
          esac
          if [ "$REPAINT" = "true" ]; then args="$args --repaint"; fi
          python3 tools/textures/paint_textures.py $args
          python3 tools/textures/reduce.py --sheet=docs/screenshots/textures/factory_run${{ github.run_number }}.png
      - name: Commit the textures
        run: |
          git add assets/textures docs/screenshots/textures
          if git diff --cached --quiet; then
            echo "No change to the textures."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Textures: paint and reduce materials (run ${{ github.run_number }})"
          git push

  backdrop:
    if: ${{ inputs.backdrop != '' && inputs.style == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Paint the backdrop and cut it into strips
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TEXTURE_MODEL: ${{ inputs.paint_model || vars.TEXTURE_MODEL }}
          PAINT_MODEL: ${{ vars.PAINT_MODEL }}
          WHICH: ${{ inputs.backdrop }}
          REPAINT: ${{ inputs.repaint }}
        run: |
          pip install pillow numpy scipy
          args="--only=$WHICH"
          if [ "$REPAINT" = "true" ]; then args="$args --repaint"; fi
          python3 tools/textures/paint_backdrop.py $args || echo "Some panels weren't painted (see above)"
          python3 tools/textures/reduce_backdrop.py --sheet=docs/screenshots/backdrop/run${{ github.run_number }}.png || echo "Cutting failed (see above)"
      - name: Commit the backdrop
        run: |
          git add assets/textures docs/screenshots/backdrop || true
          if git diff --cached --quiet; then
            echo "No change to the backdrop."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Backdrop: paint and cut (run ${{ github.run_number }})"
          git push

  characters:
    if: ${{ inputs.characters != '' && inputs.backdrop == '' && inputs.style == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Paint them full length, then Tripo
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
          TEXTURE_MODEL: ${{ inputs.paint_model || vars.PAINT_MODEL }}
          WHICH: ${{ inputs.characters }}
          REPAINT: ${{ inputs.repaint }}
        run: |
          pip install pillow numpy scipy
          args=""
          if [ "$WHICH" != "all" ]; then args="--only=$WHICH"; fi
          rp=""
          if [ "$REPAINT" = "true" ]; then rp="--repaint"; fi
          python3 tools/characters/paint_full_length.py $args $rp
          python3 tools/characters/tripo.py --dry-run
          if [ -n "$TRIPO_API_KEY" ]; then python3 tools/characters/tripo.py --balance; fi
          python3 tools/characters/tripo.py $args || echo "Tripo step failed (see above)"
      - name: Commit them
        run: |
          git add assets/people/tripo
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Characters: image-to-3D (run ${{ github.run_number }})"
          git push

  people:
    if: ${{ inputs.style == '' && inputs.textures == '' && inputs.characters == '' && inputs.backdrop == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Godot
        if: inputs.paint_views == ''
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: inputs.paint_views == '' && steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          rm ./*.zip

      - name: Cache MakeHuman assets
        if: inputs.paint_views == ''
        uses: actions/cache@v4
        with:
          path: build/makehuman
          key: makehuman-${{ hashFiles('tools/blender/fetch_makehuman.py', 'assets/people/people.json') }}

      - name: Install Blender (bpy), numpy and Pillow
        if: inputs.paint_views == ''
        run: pip install "bpy==${BPY_VERSION}" numpy pillow

      # His body painted from the concept painting: the image model paints each grey view of him
      # (assets/people/paint/<id>_<view>_guide.png, rendered by tools/paint_bake.gd, which bakes
      # the paintings onto him afterwards: it needs a GPU, so it runs in a workspace, not here).
      - name: Paint views
        if: inputs.paint_views != ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PAINT_MODEL: ${{ inputs.paint_model || vars.PAINT_MODEL }}
          ONLY: ${{ inputs.only }}
          VIEWS: ${{ inputs.paint_views }}
          REPAINT: ${{ inputs.repaint }}
          SHEET: ${{ inputs.paint_sheet }}
          HEAD_SHEET: ${{ inputs.paint_head_sheet }}
        run: |
          pip install pillow
          args="--only=$ONLY --views=$VIEWS"
          if [ "$REPAINT" = "true" ]; then args="$args --repaint"; fi
          if [ "$SHEET" = "true" ]; then args="$args --sheet"; fi
          if [ "$HEAD_SHEET" = "true" ]; then args="$args --head-sheet"; fi
          python tools/paint/paint_views.py $args

      - name: Body envelope from the anatomy
        if: inputs.paint_views == ''
        run: |
          ~/godot/godot --headless --import || true
          ~/godot/godot --headless -s res://tools/people_envelope.gd

      - name: Fetch MakeHuman assets
        if: inputs.paint_views == ''
        run: python tools/blender/fetch_makehuman.py

      - name: Make people
        if: inputs.paint_views == ''
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            python tools/blender/make_people.py --only="${{ inputs.only }}"
          else
            python tools/blender/make_people.py
          fi

      # Faces: the image model paints each man's face onto the front view of his head that the
      # first run wrote; the second run projects it on. Skipped without the secret.
      - name: Paint faces
        if: inputs.paint_views == ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FACE_MODEL: ${{ vars.FACE_MODEL }}
        run: |
          args=""
          if [ -n "${{ inputs.only }}" ]; then args="--only=${{ inputs.only }}"; fi
          if [ "${{ inputs.repaint }}" = "true" ]; then args="$args --repaint"; fi
          python tools/faces/paint_face.py $args

      - name: Make people again (with the faces)
        if: inputs.paint_views == ''
        run: |
          if ls assets/people/*_face_portrait.png >/dev/null 2>&1; then
            if [ -n "${{ inputs.only }}" ]; then
              python tools/blender/make_people.py --only="${{ inputs.only }}"
            else
              python tools/blender/make_people.py
            fi
          fi

      - name: Import and test with the new bodies
        if: inputs.paint_views == ''
        run: |
          ~/godot/godot --headless --import || true
          ~/godot/godot --headless --fixed-fps 60 -s res://tests/run_tests.gd

      - name: Commit the generated people
        env:
          PAINT_VIEWS: ${{ inputs.paint_views }}
        run: |
          git add assets/people
          if git diff --cached --quiet; then
            echo "No change to the people."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$PAINT_VIEWS" ]; then
            git commit -m "People: paint views from the painting (run ${{ github.run_number }})"
          else
            git commit -m "People: regenerate from MakeHuman (run ${{ github.run_number }})"
          fi
          git push
